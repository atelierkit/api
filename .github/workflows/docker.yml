name: 构建并推送镜像

# 提及：镜像默认推送到 GitHub Container Registry（ghcr.io，用内置 GITHUB_TOKEN，无需额外配置）；
# 若要像私有项目那样推阿里云私有仓库，追加一个 docker/login-action 与对应的 secrets 即可。
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  quality:
    name: 代码检查与单元测试
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v6

      - name: 安装 Node 运行环境
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: yarn

      - name: 安装依赖
        # CI 里不需要 husky 的 git hooks
        run: yarn install --frozen-lockfile
        env:
          HUSKY: 0

      - name: 代码检查
        run: yarn lint

      - name: 单元测试与覆盖率门槛
        # 覆盖率门槛只在带 --coverage 时生效，所以 CI 跑 test:cov 而不是 test
        run: yarn test:cov

  docker:
    name: 构建并推送镜像
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 拉取代码
        uses: actions/checkout@v6

      - name: 准备 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录镜像仓库
        # PR 只验证能否构建，不推送
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          # 各子应用的 Dockerfile 放在自己目录下，构建上下文仍是仓库根（需要 package.json / tsconfig / libs）
          context: .
          file: apps/api/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
